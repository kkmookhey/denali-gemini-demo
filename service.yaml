apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: denali-gemini-demo
  namespace: "32976044400"
  labels:
    cloud.googleapis.com/location: us-central1
    denali_ai_workload: "true"
    denali_demo_path: golden
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        denali_ai_workload: "true"
        denali_demo_path: golden
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 8
      timeoutSeconds: 45
      serviceAccountName: denali-gemini-demo@vertex-api-502308.iam.gserviceaccount.com
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: vertex-api-502308
            - name: VERTEX_LOCATION
              value: us-central1
            - name: VERTEX_MODEL_ID
              value: gemini-2.5-flash
  traffic:
    - latestRevision: true
      percent: 100
